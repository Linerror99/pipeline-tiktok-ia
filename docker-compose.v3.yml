# Reetik V3 — Docker Compose (développement local)

services:
  backend-v3:
    build:
      context: ./backend-v3
      dockerfile: Dockerfile
    ports:
      - "8000:8080"
    environment:
      - PROJECT_ID=reetik-project
      - REGION=us-central1
      - BUCKET_NAME_V3=reetik-v3-artifacts
      - BUCKET_UPLOADS_V3=reetik-v3-uploads
      - BUCKET_THUMBNAILS_V3=reetik-v3-thumbnails
      - JWT_SECRET_KEY=dev-secret-key-change-in-production-min-32-chars
      - GOOGLE_APPLICATION_CREDENTIALS=/credentials/service-account.json
    volumes:
      - ./backend/credentials.json:/credentials/service-account.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v3/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - reetik-v3

  frontend-v3:
    build:
      context: ./frontend-v3
      dockerfile: Dockerfile
    container_name: reetik-frontend-v3
    ports:
      - "3000:80"
    depends_on:
      - backend-v3
    restart: unless-stopped
    networks:
      - reetik-v3

networks:
  reetik-v3:
    driver: bridge
