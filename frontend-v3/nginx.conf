server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Required for Firebase signInWithPopup — allows parent window to check popup.closed
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # WebSocket vidéo — doit être avant le bloc /api/v3/ générique
    location ~ ^/api/v3/videos/[^/]+/ws$ {
        proxy_pass         http://backend-v3:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_read_timeout 3600s;
    }

    # Proxy API → backend-v3
    location /api/v3/ {
        proxy_pass         http://backend-v3:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket legacy → backend-v3 (route /ws/v3/video/{id})
    location /ws/v3/ {
        proxy_pass         http://backend-v3:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
